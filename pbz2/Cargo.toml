[package]
name = "pbz2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Fast parallel bzip2 compression and decompression behind std::io::Read and Write, and a pbz2 command that replaces bzip2"
readme = "../README.md"
keywords = ["bzip2", "compression", "decompression", "parallel", "cli"]
categories = ["compression", "command-line-utilities"]
include = ["src", "LICENSE", "NOTICE"]

[[bin]]
name = "pbz2"
path = "src/cli/main.rs"
doc = false
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[lints]
workspace = true

[features]
default = ["simd", "cli"]
simd = ["pbz2-core/simd", "dep:fearless_simd"]
cli = ["dep:eyre", "dep:lexopt"]

[dependencies]
pbz2-core.workspace = true
eyre = { workspace = true, optional = true }
fearless_simd = { workspace = true, optional = true, features = ["std"] }
lexopt = { workspace = true, optional = true }
rayon.workspace = true
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
bzip2.workspace = true
fearless_simd = { workspace = true, features = ["std"] }
insta.workspace = true
md-5.workspace = true
proc-macro2.workspace = true
syn.workspace = true
