[workspace]
members = ["pbz2", "pbz2-core"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["Soof Golan"]
license = "MIT"
repository = "https://github.com/soof-golan/pbz2"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"

[profile.release]
lto = true
panic = "abort"
strip = true

[workspace.dependencies]
pbz2-core = { path = "pbz2-core", version = "0.2.0" }
bytemuck = { version = "1", default-features = false }
eyre = "0.6"
lexopt = "0.3"
fearless_simd = { version = "1", default-features = false }
thiserror = { version = "2", default-features = false }
bzip2 = "0.6"
criterion = "0.8"
insta = "1"
md-5 = "0.10"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
